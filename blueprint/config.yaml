schema: spec-driven

context: |
  Project: UniHub Workshop — university workshop management system
  Stack: React (Vite) + TailwindCSS (frontend) | NestJS + Prisma + PostgreSQL + Redis (backend)
  Infrastructure: Docker Compose (Postgres 16, Redis 7, MailHog)
  Workers: Bull Queue for async jobs (notification, CSV sync, AI summary)
  Auth: JWT + Passport.js, RBAC with 3 roles: STUDENT, ORGANIZER, CHECKIN_STAFF
  Repo layout: /client (React), /server (NestJS), /blueprint (OpenSpec docs), /data (seed + CSV)
  Key patterns:
    - Redis DECR atomic for slot claiming (no DB lock)
    - opossum Circuit Breaker for payment gateway
    - Idempotency-Key header + Redis TTL 24h for double-charge prevention
    - IndexedDB (idb) for offline check-in queue, sync on reconnect
    - Bull cronjob at 2am for CSV student import
    - pdf-parse → AI API for workshop AI summary (pipe-and-filter)
  API conventions: RESTful JSON, guards on every protected endpoint, global ValidationPipe
  Testing: manual + docker-compose fresh run

rules:
  proposal:
    - State the problem clearly with measurable impact
    - Include in-scope and out-of-scope boundaries
    - Identify key risks
  specs:
    - Use Given/When/Then format for all scenarios
    - Cover both happy path and error/edge cases
    - Reference the relevant pattern from TASK.MD when applicable
  design:
    - Include sequence or flow diagrams for complex interactions
    - Document Architecture Decision Records (ADR) for major choices
    - Map modules to NestJS module names
  tasks:
    - Group by module/feature area
    - Use hierarchical numbering (1.1, 1.2)
    - Keep each task small enough to complete in one coding session
